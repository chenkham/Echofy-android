build:
  maxIssues: -1
  excludeCorrectable: false

config:
  validation: false
  warningsAsErrors: false
  checkExhaustiveness: false

complexity:
  active: true
  LargeClass:
    active: true
    threshold: 250
  LongMethod:
    active: true
    threshold: 60
  CyclomaticComplexMethod:
    active: true
    threshold: 15
  TooManyFunctions:
    active: true
    thresholdInFiles: 25
    thresholdInClasses: 20
    thresholdInInterfaces: 15
    thresholdInObjects: 20
    thresholdInEnums: 15
  NestedBlockDepth:
    active: true
    threshold: 4
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7
    ignoreDefaultParameters: true
  StringLiteralDuplication:
    active: true
    threshold: 5
    ignoreAnnotation: true
    excludeStringsWithLessThan5Characters: true
    ignoreStringsRegex: '$^'

style:
  active: true
  UnusedPrivateMember:
    active: true
    allowedNames: '(_|ignored|expected)'
  UnusedPrivateProperty:
    active: true
    allowedNames: '(_|ignored|expected)'
  UnusedPrivateClass:
    active: true
  ModifierOrder:
    active: true

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunWithCoroutineScopeReceiver:
    active: true
  SuspendFunWithFlowReturnType:
    active: true
  InjectDispatcher:
    active: true

potential-bugs:
  active: true
  UnreachableCode:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  DontDowncastCollectionTypes:
    active: true
  UnnecessaryNotNullOperator:
    active: true
  UnsafeCast:
    active: true
